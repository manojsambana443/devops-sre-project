apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: memory-app-health
  namespace: monitoring
  labels:
    release: monitoring
spec:
  jobName: memory-app-health
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://memory-app.devops-sre.svc.cluster.local:80/healthcheck
