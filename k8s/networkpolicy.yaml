apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memory-app-ingress
  namespace: devops-sre
spec:
  podSelector:
    matchLabels:
      app: memory-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: allowed
      ports:
        - protocol: TCP
          port: 8080
