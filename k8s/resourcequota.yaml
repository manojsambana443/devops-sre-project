
apiVersion: v1
kind: ResourceQuota
metadata:
  name: devops-sre-quota
  namespace: devops-sre
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "3"
    limits.memory: 1536Mi
    pods: "10"
    configmaps: "10"
    secrets: "10"
    services: "5"
    persistentvolumeclaims: "2"
