
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-app-v1
  namespace: devops-sre
  labels:
    app: memory-app
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-app
      version: v1
  template:
    metadata:
      labels:
        app: memory-app
        version: v1
    spec:
      initContainers:
        - name: validate-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              test -n "$APP_ENV" &&
              test -n "$LOG_LEVEL" &&
              echo "Configuration validation passed"
          envFrom:
            - configMapRef:
                name: memory-app-config
      containers:
        - name: memory-app
          image: memory-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: memory-app-config
          resources:
            requests:
              memory: "100Mi"
            limits:
              memory: "400Mi"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

